
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            background-color: rgb(255, 253, 231);
            line-height: 150px;
        }

        .con {
            height: 380px;
            background-color: rgb(255, 253, 231);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }

        .square {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            border-radius: 10px;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            color: white;
            text-align: center;
            line-height: 100px;
        }

        .s6 {
            border: 10px solid white;
            border-top: 10px solid blue;
            border-radius: 50%;
            animation-name: rotate;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .s1 {
            background-color: red;
            animation-name: colour;
        }

        @keyframes colour {
            from {
                background-color: red;
            }
            to {
                background-color: blue;
            }
        }

        .s2 {
            background-color: green;
            animation-name: move;
        }

        @keyframes move {
            0% {
                transform: translate(0);
            }
            50% {
                transform: translate(0, 50px);
            }
            100% {
                transform: translate(0);
            }
        }

        .s3 {
            background-color: orange;
            animation-name: rotate;
        }

        .s4 {
            background-color: blue;
            animation-name: pulse;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.5);
            }
            100% {
                transform: scale(1);
            }
        }

        .s5 {
            background-color: grey;
            animation-name: fade;
        }

        @keyframes fade {
            0% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .bottom {
            display: grid;
            gap: 25px;
        }

        .left, .right {
            min-height: 380px;
            background: white;
            border: 1px solid #fefc84;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(23,37,84,0.08);
        }

        .left {
            width: 400px;
            overflow: hidden;
        }

        .right {
            width: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .box {
            width: 90px;
            height: 90px;
            background: blueviolet;
            border-radius: 12px;
            animation-name: box-move;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes box-move {
            0% { transform: translate(0, 0); }
            25% { transform: translate(220px, 0); }
            50% { transform: translate(220px, 180px); }
            75% { transform: translate(0, 180px); }
            100% { transform: translate(0, 0); }
        }

        .balls {
            height: 45px;
            width: 45px;
            border-radius: 50%;
            animation-name: google;
            animation-iteration-count: infinite;
            animation-duration: 1.5s;
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
        }

        @keyframes google {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(50px); }
        }

        .b1 { background-color: #ea4335; }
        .b2 { background-color: #fbbc05; animation-delay: .2s; }
        .b3 { background-color: #34a853; animation-delay: .4s; }
        .b4 { background-color: #4285f4; animation-delay: .6s; }
        .b5 { background-color: #a855f7; animation-delay: .8s; }

    </style>
</head>

<body>

    <h1>CSS Animations Showcase</h1>

    <div class="con">
        <div class="square s1">Color</div>
        <div class="square s2">Move</div>
        <div class="square s3">Rotate</div>
        <div class="square s4">Pulse</div>
        <div class="square s5">Fade</div>
        <div class="square s6"></div>
    </div>

    <div class="con">
        <div class="left">
            <div class="box"></div>
        </div>

        <div class="right">
            <div class="balls b1"></div>
            <div class="balls b2"></div>
            <div class="balls b3"></div>
            <div class="balls b4"></div>
            <div class="balls b5"></div>
        </div>
    </div>

</body>
</html>
