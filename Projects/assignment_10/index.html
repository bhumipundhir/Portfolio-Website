<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            
    
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    h1 {
        height: auto;
        margin-top: 25px;
        margin-bottom: 35px;
    }

    .box {
        min-height: 100vh;
        width: 100%;
        background: linear-gradient(90deg, skyblue, violet);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    form {
        height: 500px;
        width: 380px;
        max-width: 100%;
        background-color: white;
        border-radius: 5px;
        text-transform: capitalize;
        padding: 1px 0;
    }

    label {
        width: 100%;
    }

    input {
        height: 40px;
        width: 100%;
        border: 1px solid black;
        border-radius: 10px;
        margin-top: 10px;
        padding: 8px;
    }

    .email,
    .password,
    .login {
        width: 80%;
        margin: auto;
        display: flex;
        flex-direction: column;
    }

    .email {
        margin-bottom: 30px;
    }

    .password {
        margin-bottom: 15px;
    }

    #login {
        background: linear-gradient(90deg, skyblue, violet);
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 25px;
        border: none;
        color: white;
        border-radius: 10px;
        cursor: pointer;
    }

    .password > p {
        color: gray;
        margin-top: 8px;
        text-align: right;
    }

    .login > p {
        text-align: center;
        margin-top: 15px;
    }

    </style>
</head>
<body>
    <div class="box">
    <form action="">
        <h1 align="center">Login Form</h1>
        <div class="email">
            <label for="">Email or Phone</label>
            <input type="text" placeholder="xyz@gmail.com">
        </div>
        <div class="password">
            <label for="">Password</label>
            <input type="password"placeholder="Abcd@1234">
            <p>Forgot Password?</p>
        </div>
        <div class="login">
            <input type="button" value="LOGIN" id="login">
            <p>Not a Member? <a href="Signup.html">Sign Up</a></p>
            <p></p>     
        </div>
    </form>
    </div>
</body>
</html>
